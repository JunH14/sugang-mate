name: Anonymous hosted demo

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify public access from a GitHub runner
        run: python scripts/check_hosted_demo.py --base-url https://sugang-mate.onrender.com --output artifacts/hosted-smoke.json
      - name: Verify the chat-screen JSON endpoint independently
        if: always()
        run: python scripts/check_chat_screen.py --base-url https://sugang-mate.onrender.com --output artifacts/chat-screen-smoke.json
      - name: Preserve aggregate evidence without conversation content
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anonymous-hosted-demo
          path: |
            artifacts/hosted-smoke.json
            artifacts/chat-screen-smoke.json
          if-no-files-found: error
          retention-days: 14
